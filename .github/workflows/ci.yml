name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências do backend
        run: npm ci
        working-directory: apps/backend

      - name: Instalar dependências do frontend
        run: npm ci
        working-directory: apps/frontend

      - name: Lint backend
        run: npm run lint
        working-directory: apps/backend

      - name: Testes backend
        run: npm run test
        working-directory: apps/backend

      - name: Build backend
        run: npm run build
        working-directory: apps/backend

      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend
