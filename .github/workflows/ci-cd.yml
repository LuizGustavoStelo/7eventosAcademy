name: CI/CD

on:
  pull_request:
  push:
    branches: ["main"]
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validar (lint/test/build)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
      NPM_CONFIG_OMIT: ""
      NPM_CONFIG_INCLUDE: "dev"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json

      - name: Instalar dependências (workspaces)
        run: npm ci --include=dev

      - name: Diagnóstico npm/eslint
        run: |
          npm -v
          node -v
          npm config get omit
          npm exec --workspace backend -- eslint --version

      - name: Lint backend
        run: npm run lint --workspace backend

      - name: Testes backend
        run: npm run test --workspace backend

      - name: Build backend
        run: npm run build --workspace backend

      - name: Build frontend
        run: npm run build --workspace frontend

  build-and-push:
    name: Build e push de imagens
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tags
        id: meta
        run: |
          echo "sha_tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Normalizar nomes das imagens (lowercase)
        id: image_names
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "backend=${REPO_LC}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${REPO_LC}-frontend" >> "$GITHUB_OUTPUT"

      - name: Build e push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_names.outputs.backend }}:latest
            ${{ env.REGISTRY }}/${{ steps.image_names.outputs.backend }}:${{ steps.meta.outputs.sha_tag }}

      - name: Build e push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_names.outputs.frontend }}:latest
            ${{ env.REGISTRY }}/${{ steps.image_names.outputs.frontend }}:${{ steps.meta.outputs.sha_tag }}

  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy remoto na VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/7eventosAcademy
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T backend npx prisma migrate deploy --schema /app/apps/backend/prisma/schema.prisma
            docker image prune -f
