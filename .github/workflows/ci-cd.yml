name: CI/CD

on:
  pull_request:
  push:
    branches: ["main"]
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validar (lint/test/build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências do backend
        run: npm ci
        working-directory: apps/backend

      - name: Instalar dependências do frontend
        run: npm ci
        working-directory: apps/frontend

      - name: Lint backend
        run: npm run lint
        working-directory: apps/backend

      - name: Testes backend
        run: npm run test
        working-directory: apps/backend

      - name: Build backend
        run: npm run build
        working-directory: apps/backend

      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend

  build-and-push:
    name: Build e push de imagens
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tags
        id: meta
        run: |
          echo "sha_tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Normalizar nomes das imagens (lowercase)
        id: image_names
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "backend=${REPO_LC}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${REPO_LC}-frontend" >> "$GITHUB_OUTPUT"

      - name: Build e push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_names.outputs.backend }}:latest
            ${{ env.REGISTRY }}/${{ steps.image_names.outputs.backend }}:${{ steps.meta.outputs.sha_tag }}

      - name: Build e push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_names.outputs.frontend }}:latest
            ${{ env.REGISTRY }}/${{ steps.image_names.outputs.frontend }}:${{ steps.meta.outputs.sha_tag }}

  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy remoto na VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/7eventosAcademy
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T backend npx prisma migrate deploy || true
            docker image prune -f
