services:
  db:
    image: postgres:16-alpine
    container_name: 7eventos-academy-db
    environment:
      POSTGRES_DB: academy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - academy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d academy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: 7eventos-academy-redis
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/luizgustavostelo/7eventosacademy-backend}:${APP_VERSION:-latest}
    container_name: 7eventos-academy-backend
    env_file:
      - /var/www/7eventosAcademy/.env
    environment:
      # Caminho interno do container (arquivo real no host: /var/www/7eventosAcademy/secrets/academy_master_key.txt)
      SECRETS_MASTER_KEY_FILE: /run/secrets/academy_master_key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    secrets:
      - academy_master_key
    ports:
      - "127.0.0.1:3210:3210"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3210/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/luizgustavostelo/7eventosacademy-frontend}:${APP_VERSION:-latest}
    container_name: 7eventos-academy-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:8090:80"
    restart: unless-stopped

volumes:
  academy_pgdata:

secrets:
  academy_master_key:
    file: /var/www/7eventosAcademy/secrets/academy_master_key.txt
